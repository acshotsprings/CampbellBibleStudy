name: Twice Daily Site Backup

on:
  schedule:
    # Runs at 11:00 and 23:00 UTC (6am and 6pm Central Time)
    - cron: '0 11,23 * * *'
  workflow_dispatch:  # Allows manual trigger from the Actions tab

# No write access needed — backups are uploaded as artifacts, not committed.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create backup zip
        run: |
          STAMP=$(date -u +"%Y-%m-%d-%H%M")
          ZIPNAME="site-${STAMP}.zip"
          # Zip everything EXCEPT the resources/ folder, the .git folder,
          # the .github folder, and any existing zip (avoid recursion).
          zip -r "$ZIPNAME" . \
            -x "resources/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.zip"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "Created: $ZIPNAME"
          ls -lh "$ZIPNAME"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v5
        with:
          name: site-backup-${{ env.STAMP }}
          path: site-*.zip
          retention-days: 30
